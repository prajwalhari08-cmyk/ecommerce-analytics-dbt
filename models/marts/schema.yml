version: 2

models:
  - name: fct_orders
    columns:
      - name: order_id
        tests:
          - unique
          - not_null
      - name: delivery_speed_category
        tests:
          - accepted_values:
              values: ['Fast (0-3 Days)', 'Standard (4-7 Days)', 'Delayed (>7 Days)', 'Undelivered / Unknown']

  - name: dim_customers
    columns:
      - name: customer_unique_id
        tests:
          - unique
          - not_null